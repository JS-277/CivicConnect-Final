<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CivicConnect - Admin Dashboard</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: "Inter", sans-serif;
            background: #f4f7fb;
            color: #10213b;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            background: white;
            min-height: 72px;
            padding: 0 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #e5eaf1;
        }


        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
        }


        .logo-icon {
            width: 36px;
            height: 36px;
            background: #1769e0;
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }


        .admin-label {
            font-size: 13px;
            font-weight: 700;
            color: #6e7f96;
            letter-spacing: 1px;
        }


        /* ================= MAIN ================= */

        .container {
            width: 88%;
            max-width: 1250px;
            margin: 45px auto;
        }


        .page-heading {
            margin-bottom: 30px;
        }


        .page-heading span {
            color: #1769e0;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
        }


        .page-heading h1 {
            margin-top: 8px;
            font-size: 34px;
            font-weight: 800;
        }


        .page-heading p {
            margin-top: 8px;
            color: #718096;
        }


        /* ================= STATS ================= */

        .stats {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;
            margin-bottom: 30px;
        }


        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #e6ebf2;
            box-shadow:
                0 8px 25px rgba(20, 45, 80, 0.05);
        }


        .stat-title {
            color: #718096;
            font-size: 13px;
            font-weight: 600;
        }


        .stat-number {
            margin-top: 8px;
            font-size: 30px;
            font-weight: 800;
        }


        /* ================= TOOLBAR ================= */

        .toolbar {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            border: 1px solid #e6ebf2;
        }


        .search-box {
            flex: 1;
        }


        .search-box input,
        .filter-box select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #d7dfeb;
            border-radius: 9px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }


        .search-box input:focus,
        .filter-box select:focus {
            border-color: #1769e0;
        }


        .filter-box {
            width: 210px;
        }


        .refresh-btn {
            padding: 13px 20px;
            border: none;
            border-radius: 9px;
            background: #1769e0;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }


        .refresh-btn:hover {
            opacity: 0.9;
        }


        /* ================= TABLE ================= */

        .table-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e6ebf2;
            overflow: hidden;
            box-shadow:
                0 8px 25px rgba(20, 45, 80, 0.05);
        }


        .table-wrapper {
            overflow-x: auto;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }


        th {
            background: #f8fafc;
            text-align: left;
            padding: 16px;
            font-size: 12px;
            color: #718096;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }


        td {
            padding: 17px 16px;
            border-top: 1px solid #edf1f6;
            font-size: 14px;
        }


        .complaint-id {
            font-weight: 800;
            color: #1769e0;
        }


        .citizen-name {
            font-weight: 700;
        }


        .category {
            color: #596b82;
        }


        /* ================= STATUS ================= */

        .status-select {
            border: 1px solid #d7dfeb;
            border-radius: 8px;
            padding: 9px 10px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            background: white;
        }


        .status-select:focus {
            outline: none;
            border-color: #1769e0;
        }


        .view-btn {
            padding: 9px 14px;
            border: none;
            border-radius: 8px;
            background: #eef4ff;
            color: #1769e0;
            font-weight: 700;
            cursor: pointer;
        }


        /* ================= EMPTY ================= */

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
        }


        /* ================= MODAL ================= */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(10, 25, 45, 0.45);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }


        .modal.show {
            display: flex;
        }


        .modal-card {
            background: white;
            width: 100%;
            max-width: 650px;
            border-radius: 18px;
            padding: 30px;
            max-height: 90vh;
            overflow-y: auto;
        }


        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }


        .modal-header h2 {
            font-size: 23px;
        }


        .close-btn {
            border: none;
            background: #f1f4f8;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }


        .detail-grid {
            display: grid;
            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }


        .detail {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
        }


        .detail.full {
            grid-column: 1 / -1;
        }


        .detail-label {
            font-size: 11px;
            color: #718096;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
        }


        .detail-value {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.5;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 850px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }


            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }


            .filter-box {
                width: 100%;
            }

        }


        @media (max-width: 550px) {

            .container {
                width: 94%;
            }


            .stats {
                grid-template-columns:
                    1fr;
            }


            .navbar {
                padding: 0 4%;
            }


            .admin-label {
                display: none;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">

            <span class="logo-icon">
                C
            </span>

            <span>
                CivicConnect
            </span>

        </div>


        <div class="admin-label">
            ADMIN DASHBOARD
        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="container">


        <div class="page-heading">

            <span>
                SMART GOVERNANCE
            </span>

            <h1>
                Complaint Management
            </h1>

            <p>
                View citizen complaints and update their status.
            </p>

        </div>


        <!-- ================= STATS ================= -->

        <section class="stats">

            <div class="stat-card">

                <div class="stat-title">
                    Total Complaints
                </div>

                <div
                    class="stat-number"
                    id="totalCount"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Pending
                </div>

                <div
                    class="stat-number"
                    id="pendingCount"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    In Progress
                </div>

                <div
                    class="stat-number"
                    id="progressCount"
                >
                    0
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-title">
                    Resolved
                </div>

                <div
                    class="stat-number"
                    id="resolvedCount"
                >
                    0
                </div>

            </div>

        </section>


        <!-- ================= TOOLBAR ================= -->

        <section class="toolbar">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search complaint ID, citizen, district or category..."
                >

            </div>


            <div class="filter-box">

                <select id="statusFilter">

                    <option value="All">
                        All Status
                    </option>

                    <option value="Pending">
                        Pending
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Resolved">
                        Resolved
                    </option>

                </select>

            </div>


            <button
                class="refresh-btn"
                onclick="loadComplaints()"
            >
                Refresh
            </button>

        </section>


        <!-- ================= TABLE ================= -->

        <section class="table-card">

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Complaint ID
                            </th>

                            <th>
                                Citizen
                            </th>

                            <th>
                                Category
                            </th>

                            <th>
                                District
                            </th>

                            <th>
                                Location
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Details
                            </th>

                        </tr>

                    </thead>


                    <tbody id="complaintsTable">

                    </tbody>

                </table>

            </div>


            <div
                class="empty"
                id="emptyMessage"
                style="display:none;"
            >
                No complaints found.
            </div>

        </section>

    </main>


    <!-- ================= MODAL ================= -->

    <div
        class="modal"
        id="detailModal"
    >

        <div class="modal-card">

            <div class="modal-header">

                <h2>
                    Complaint Details
                </h2>

                <button
                    class="close-btn"
                    onclick="closeModal()"
                >
                    ×
                </button>

            </div>


            <div
                class="detail-grid"
                id="detailContent"
            >
            </div>

        </div>

    </div>


    <script>

        const API_URL =
            "http://localhost:8080/api/complaints";


        let complaints = [];


        // =====================================================
        // LOAD COMPLAINTS
        // =====================================================

        async function loadComplaints() {

            const table =
                document.getElementById(
                    "complaintsTable"
                );

            table.innerHTML =
                `
                    <tr>
                        <td
                            colspan="7"
                            style="text-align:center;padding:40px;"
                        >
                            Loading complaints...
                        </td>
                    </tr>
                `;


            try {

                const response =
                    await fetch(API_URL);


                if (!response.ok) {

                    throw new Error(
                        "Server error: " +
                        response.status
                    );
                }


                complaints =
                    await response.json();


                updateStats();

                renderComplaints();


            } catch (error) {

                console.error(error);


                table.innerHTML =
                    `
                        <tr>
                            <td
                                colspan="7"
                                style="text-align:center;padding:40px;color:#d33;"
                            >
                                Unable to load complaints.
                                Make sure the Java server is running.
                            </td>
                        </tr>
                    `;
            }
        }


        // =====================================================
        // UPDATE STATISTICS
        // =====================================================

        function updateStats() {

            let pending = 0;
            let progress = 0;
            let resolved = 0;


            complaints.forEach(
                function (complaint) {

                    const status =
                        complaint.status ||
                        "Pending";


                    if (status === "Pending") {

                        pending++;

                    } else if (
                        status === "In Progress"
                    ) {

                        progress++;

                    } else if (
                        status === "Resolved"
                    ) {

                        resolved++;
                    }
                }
            );


            document.getElementById(
                "totalCount"
            ).textContent =
                complaints.length;


            document.getElementById(
                "pendingCount"
            ).textContent =
                pending;


            document.getElementById(
                "progressCount"
            ).textContent =
                progress;


            document.getElementById(
                "resolvedCount"
            ).textContent =
                resolved;
        }


        // =====================================================
        // RENDER TABLE
        // =====================================================

        function renderComplaints() {

            const table =
                document.getElementById(
                    "complaintsTable"
                );


            const empty =
                document.getElementById(
                    "emptyMessage"
                );


            const search =
                document.getElementById(
                    "searchInput"
                ).value
                    .trim()
                    .toLowerCase();


            const filter =
                document.getElementById(
                    "statusFilter"
                ).value;


            const filtered =
                complaints.filter(
                    function (complaint) {

                        const status =
                            complaint.status ||
                            "Pending";


                        const searchableText =
                            (
                                complaint.complaintId +
                                " " +
                                complaint.name +
                                " " +
                                complaint.district +
                                " " +
                                complaint.category
                            )
                                .toLowerCase();


                        const matchesSearch =
                            searchableText.includes(
                                search
                            );


                        const matchesFilter =
                            filter === "All"
                            ||
                            status === filter;


                        return (
                            matchesSearch
                            &&
                            matchesFilter
                        );
                    }
                );


            table.innerHTML = "";


            if (filtered.length === 0) {

                empty.style.display =
                    "block";

                return;

            } else {

                empty.style.display =
                    "none";
            }


            filtered.forEach(
                function (complaint) {

                    const row =
                        document.createElement(
                            "tr"
                        );


                    const status =
                        complaint.status ||
                        "Pending";


                    row.innerHTML =
                        `
                            <td>
                                <span class="complaint-id">
                                    ${escapeHtml(
                                        complaint.complaintId
                                    )}
                                </span>
                            </td>

                            <td>
                                <span class="citizen-name">
                                    ${escapeHtml(
                                        complaint.name
                                    )}
                                </span>
                            </td>

                            <td>
                                <span class="category">
                                    ${escapeHtml(
                                        complaint.category
                                    )}
                                </span>
                            </td>

                            <td>
                                ${escapeHtml(
                                    complaint.district
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    complaint.location
                                )}
                            </td>

                            <td>

                                <select
                                    class="status-select"
                                    onchange="changeStatus(
                                        ${complaint.id},
                                        this.value
                                    )"
                                >

                                    <option
                                        value="Pending"
                                        ${status === "Pending"
                                            ? "selected"
                                            : ""}
                                    >
                                        Pending
                                    </option>

                                    <option
                                        value="In Progress"
                                        ${status === "In Progress"
                                            ? "selected"
                                            : ""}
                                    >
                                        In Progress
                                    </option>

                                    <option
                                        value="Resolved"
                                        ${status === "Resolved"
                                            ? "selected"
                                            : ""}
                                    >
                                        Resolved
                                    </option>

                                </select>

                            </td>

                            <td>

                                <button
                                    class="view-btn"
                                    onclick="showDetails(
                                        ${complaint.id}
                                    )"
                                >
                                    View
                                </button>

                            </td>
                        `;


                    table.appendChild(
                        row
                    );
                }
            );
        }


        // =====================================================
        // CHANGE STATUS
        // =====================================================

        async function changeStatus(
            id,
            status
        ) {

            try {

                const body =
                    "status=" +
                    encodeURIComponent(
                        status
                    );


                const response =
                    await fetch(
                        API_URL +
                        "/" +
                        id +
                        "/status",
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/x-www-form-urlencoded"
                            },

                            body: body
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Status update failed"
                    );
                }


                // Update local data
                const complaint =
                    complaints.find(
                        function (item) {
                            return Number(item.id)
                                === Number(id);
                        }
                    );


                if (complaint) {

                    complaint.status =
                        status;
                }


                updateStats();


                alert(
                    "Complaint " +
                    complaint.complaintId +
                    " updated to " +
                    status
                );


                renderComplaints();


            } catch (error) {

                console.error(error);

                alert(
                    "Unable to update complaint status.\n\n" +
                    error.message
                );


                loadComplaints();
            }
        }


        // =====================================================
        // SHOW DETAILS
        // =====================================================

        function showDetails(id) {

            const complaint =
                complaints.find(
                    function (item) {

                        return Number(item.id)
                            === Number(id);
                    }
                );


            if (!complaint) {

                return;
            }


            const detailContent =
                document.getElementById(
                    "detailContent"
                );


            detailContent.innerHTML =
                `
                    <div class="detail">

                        <div class="detail-label">
                            Complaint ID
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(
                                complaint.complaintId
                            )}
                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            Status
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(
                                complaint.status ||
                                "Pending"
                            )}
                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            Citizen Name
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(
                                complaint.name
                            )}
                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            Phone
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(
                                complaint.phone
                            )}
                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            District
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(
                                complaint.district
                            )}
                        </div>

                    </div>


                    <div class="detail">

                        <div class="detail-label">
                            Location
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(
                                complaint.location
                            )}
                        </div>

                    </div>


                    <div class="detail full">

                        <div class="detail-label">
                            Category
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(
                                complaint.category
                            )}
                        </div>

                    </div>


                    <div class="detail full">

                        <div class="detail-label">
                            Description
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(
                                complaint.description
                            )}
                        </div>

                    </div>


                    <div class="detail full">

                        <div class="detail-label">
                            Submitted At
                        </div>

                        <div class="detail-value">
                            ${escapeHtml(
                                complaint.createdAt
                            )}
                        </div>

                    </div>
                `;


            document.getElementById(
                "detailModal"
            ).classList.add(
                "show"
            );
        }


        // =====================================================
        // CLOSE MODAL
        // =====================================================

        function closeModal() {

            document.getElementById(
                "detailModal"
            ).classList.remove(
                "show"
            );
        }


        // =====================================================
        // CLOSE MODAL WHEN CLICKING OUTSIDE
        // =====================================================

        document.getElementById(
            "detailModal"
        ).addEventListener(
            "click",
            function (event) {

                if (
                    event.target ===
                    this
                ) {

                    closeModal();
                }
            }
        );


        // =====================================================
        // SEARCH
        // =====================================================

        document.getElementById(
            "searchInput"
        ).addEventListener(
            "input",
            renderComplaints
        );


        // =====================================================
        // FILTER
        // =====================================================

        document.getElementById(
            "statusFilter"
        ).addEventListener(
            "change",
            renderComplaints
        );


        // =====================================================
        // ESCAPE HTML
        // =====================================================

        function escapeHtml(value) {

            if (
                value === null ||
                value === undefined
            ) {

                return "";
            }


            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );
        }


        // =====================================================
        // START
        // =====================================================

        loadComplaints();

    </script>

</body>

</html>
